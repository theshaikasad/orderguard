name: orderguard
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderguard
      POSTGRES_DB: orderguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: orderguard
      PGDATABASE: orderguard
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://}
      ORDERGUARD_BUSINESS_ID: ${ORDERGUARD_BUSINESS_ID:-little-crumb-v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MUSE_REPLY_REASONING_EFFORT: ${MUSE_REPLY_REASONING_EFFORT:-}
      MUSE_INTERPRET_REASONING_EFFORT: ${MUSE_INTERPRET_REASONING_EFFORT:-}
      MUSE_SETUP_REASONING_EFFORT: ${MUSE_SETUP_REASONING_EFFORT:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_VERIFY_TOKEN: ${INSTAGRAM_VERIFY_TOKEN:-}
      INSTAGRAM_INGEST_ENABLED: ${INSTAGRAM_INGEST_ENABLED:-false}
      INSTAGRAM_API_VERSION: ${INSTAGRAM_API_VERSION:-}
      INSTAGRAM_ACCESS_TOKEN_DEFAULT: ${INSTAGRAM_ACCESS_TOKEN_DEFAULT:-}
      INSTAGRAM_OUTBOUND_ENABLED: 'false'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - '${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    ports:
      - '${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  postgres_data:
